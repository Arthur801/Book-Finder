# Production compose file for the web container. It ships in the web image at /opt/release/ and is run by the host
# state machine as: docker compose -p book-finder -f <release_dir>/compose.prod.yaml up -d
# Why project-independent: the file is the one the release was built with, so a rollback runs the old file, not the
# checkout on the host. It holds no secrets; the three SSM values arrive through WEB_ENV_FILE.
services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be a digest-pinned web image}
    # Raw format: Compose must not interpolate $VAR or parse quotes in the secrets the host renders, or a database credential
    # containing $ would reach the container changed. The host checks this with a capability probe before deploying (machine.compose_raw_env_check).
    env_file:
      - path: ${WEB_ENV_FILE:?WEB_ENV_FILE must name the rendered environment file}
        format: raw
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTPS_PORT: "443"
      # Must equal the subnet of the web network below: nginx reaches the container through the loopback port, so
      # the request arrives from this network's gateway, and only a source in this range may set forwarded headers.
      ForwardedHeaders__KnownNetworks__0: 172.31.250.0/24
      # Antiforgery keys must survive container replacement, so they live in a named volume (see dp-keys).
      DataProtection__KeysPath: /data-protection-keys
      # Turns on background Recommendation Jobs: the worker runs queued jobs and /ai submits through the job API
      # (Docs/plans/async-recommendation-jobs.md). The host injects only secrets, so this switch ships with the release;
      # to turn it off, release without this line or redeploy the previous release (deploy backlog DEP-B26).
      RecommendationJobs__Enabled: "true"
      # Turns on the MCP server at /mcp and the same-site OAuth server (/oauth/*, /.well-known/*); Mcp:PublicBaseUrl stays the
      # appsettings value https://khwebsc.com. Like the job switch, it ships with the release; to turn it off, release without
      # these lines or redeploy the previous release (Docs/Implementation-Report/book-finder-mcp-server.md, rollout runbook).
      Mcp__Enabled: "true"
      # Signing and encryption keys (D-11, D-12): unencrypted PKCS#12 files in the external oauth-certs volume,
      # created on the host before this release; the files are owned by the container user (UID 1654) with mode 0400.
      OAuth__SigningCertificatePath: /oauth-certs/signing.pfx
      OAuth__EncryptionCertificatePath: /oauth-certs/encryption.pfx
      # Pre-registered public clients (PKCE, no secret; MCP-ADR-007). Redirect URIs match exactly, so each one is listed as
      # the client sends it; VS Code and ChatGPT URIs are confirmed by the real-client test (MCP-203).
      OAuth__Clients__0__ClientId: claude
      OAuth__Clients__0__DisplayName: Claude
      OAuth__Clients__0__RedirectUris__0: https://claude.ai/api/mcp/auth_callback
      OAuth__Clients__1__ClientId: vscode
      OAuth__Clients__1__DisplayName: Visual Studio Code
      OAuth__Clients__1__RedirectUris__0: http://127.0.0.1:33418
      OAuth__Clients__1__RedirectUris__1: https://vscode.dev/redirect
      OAuth__Clients__2__ClientId: chatgpt
      OAuth__Clients__2__DisplayName: ChatGPT
      OAuth__Clients__2__RedirectUris__0: https://chatgpt.com/connector_platform_oauth_redirect
    # Loopback only: nginx on the host is the only client, and TLS terminates there.
    ports:
      - "127.0.0.1:5000:8080"
    volumes:
      - dp-keys:/data-protection-keys
      - oauth-certs:/oauth-certs:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - web

networks:
  web:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  dp-keys:
  # Created by the operator before the first MCP release; external, so compose stops instead of mounting an empty volume
  # when it is missing, and a rollback or "down" never removes it.
  oauth-certs:
    external: true
    name: book-finder-oauth-certs
