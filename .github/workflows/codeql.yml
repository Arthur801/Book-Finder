name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 03:27 UTC.
    - cron: '27 3 * * 1'

permissions:
  contents: read

concurrency:
  # Pushes to main are keyed per commit so every merge commit keeps its own run; PRs still cancel superseded runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The project targets .NET 10, which CodeQL autobuild cannot detect reliably, so C# uses manual build mode.
          - language: csharp
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        if: matrix.build-mode == 'manual'
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - run: dotnet build Book-Finder.slnx -c Release
        if: matrix.build-mode == 'manual'

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
