name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pushes to main are keyed per commit so every merge commit keeps its own run; PRs still cancel superseded runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SDK version comes from global.json so CI and local builds use the same SDK feature band (10.0.1xx) and dotnet format.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore Book-Finder.slnx

      # Fails when whitespace or formatting in the .NET projects differs from dotnet format's default rules (the repo has no .editorconfig).
      - run: dotnet format Book-Finder.slnx --verify-no-changes --no-restore

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      # Dependabot bumps EF Core packages and compose.yaml but not dotnet-tools.json or the test fixtures' pgvector image; fail when they drift.
      - run: python .github/scripts/check_version_sync.py

      # Published migrations are immutable. The latest release's migrations.txt is attached by the release workflow. Only
      # "no release exists yet" skips the comparison; any other gh failure (API, auth, network) or a release without the
      # asset fails the job.
      - name: Check migrations against the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          released_dir="$RUNNER_TEMP/released"
          release_err="$RUNNER_TEMP/release-view.err"
          released_args=()
          if tag=$(gh release view --json tagName --jq .tagName 2>"$release_err"); then
            if ! gh release download "$tag" --pattern migrations.txt --dir "$released_dir" || [ ! -f "$released_dir/migrations.txt" ]; then
              echo "::error::latest release $tag has no migrations.txt asset"
              exit 1
            fi
            released_args=(--released-manifest "$released_dir/migrations.txt")
          elif grep -q 'release not found' "$release_err"; then
            echo "No release exists yet; skipping the released-migration comparison."
          else
            cat "$release_err"
            echo "::error::cannot read the latest release"
            exit 1
          fi
          python .github/scripts/check_migrations.py "${released_args[@]}"

      # The ruff version is pinned in crawler/requirements.txt, the single source of truth for this job.
      - run: |
          ruff_pin=$(grep -E '^ruff==' requirements.txt || true)
          test -n "$ruff_pin" || { echo "::error::ruff==<version> pin not found in crawler/requirements.txt"; exit 1; }
          pip install "$ruff_pin"
        working-directory: crawler

      - run: ruff check --output-format github .
        working-directory: crawler

      - run: ruff format --check .
        working-directory: crawler

      # The CI scripts share the crawler's ruff settings; the host code is checked for Python 3.12 (deploy/ruff.toml).
      - run: ruff check --output-format github --config crawler/ruff.toml .github/scripts

      - run: ruff format --check --config crawler/ruff.toml .github/scripts

      - run: ruff check --output-format github --config deploy/ruff.toml deploy

      - run: ruff format --check --config deploy/ruff.toml deploy

      # The pytest version is pinned in crawler/requirements.txt, like ruff, so both tools move together.
      - run: |
          pytest_pin=$(grep -E '^pytest==' requirements.txt || true)
          test -n "$pytest_pin" || { echo "::error::pytest==<version> pin not found in crawler/requirements.txt"; exit 1; }
          pip install "$pytest_pin"
        working-directory: crawler

      - run: pytest .github/scripts/tests deploy/tests -q

      # The host program runs on Ubuntu 24.04's Python 3.12, so its tests also run there to catch newer syntax or stdlib use.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - run: |
          pytest_pin=$(grep -E '^pytest==' requirements.txt || true)
          test -n "$pytest_pin" || { echo "::error::pytest==<version> pin not found in crawler/requirements.txt"; exit 1; }
          python -m pip install "$pytest_pin"
        working-directory: crawler

      - run: python -m pytest deploy/tests -q

      # These scripts run in the Docker job (release manifest, smoke tests and migration compat check); shellcheck catches shell mistakes earlier.
      - run: shellcheck deploy/release/build-manifest.sh deploy/smoke/web-smoke.sh deploy/lib/manifest.sh deploy/lib/smoke.sh deploy/migration-test/compat.sh

  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # No packages.lock.json is checked in, so setup-dotnet's built-in cache cannot be keyed; cache the NuGet store directly.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore Book-Finder.slnx

      - run: dotnet build Book-Finder.slnx --no-restore -c Release

      # Integration projects start pgvector through Testcontainers; ubuntu-latest provides Docker.
      - run: dotnet test Book-Finder.slnx --no-build -c Release --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults
          if-no-files-found: warn

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: the migration check needs the merge base with origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Built locally and never pushed; the smoke test runs with placeholder secrets on an internal network.
      - run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t book-finder-web:ci .

      - run: bash deploy/smoke/web-smoke.sh book-finder-web:ci

      # Without the shared key volume, antiforgery must be rejected after a container replacement.
      - run: bash deploy/smoke/web-smoke.sh book-finder-web:ci --control-no-keys

      # Pushes to main have no pending migration change to check; only PRs that touch migrations run the compat check.
      - name: Detect migration changes
        id: migration-detect
        if: github.event_name == 'pull_request'
        run: |
          base_commit=$(git merge-base origin/main HEAD)
          if git diff --quiet "$base_commit" HEAD -- Infrastructure/Persistence/Migrations; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The base image is built from the merge base, so the check upgrades what production runs today to this PR's schema.
      - name: Migration compat check
        id: compat
        if: steps.migration-detect.outputs.changed == 'true'
        run: |
          base_commit=$(git merge-base origin/main HEAD)
          git worktree add --detach "$RUNNER_TEMP/base" "$base_commit"
          docker build --build-arg GIT_COMMIT="$base_commit" -t bf-ci-base:main "$RUNNER_TEMP/base"
          base_cid=$(docker create bf-ci-base:main)
          docker cp "$base_cid:/opt/release/migrations.txt" "$RUNNER_TEMP/applied.txt"
          docker rm "$base_cid" >/dev/null
          bash deploy/migration-test/compat.sh \
            --rebuild-image bf-ci-base:main \
            --target-image book-finder-web:ci \
            --runtime-image bf-ci-base:main \
            --applied "$RUNNER_TEMP/applied.txt" \
            --seeds-dir deploy/migration-test/seeds \
            --report "$RUNNER_TEMP/compat-report.json"

      # Runs even when compat fails, so the reviewer sees which mandatory check broke.
      - name: Summarize migration compat report
        if: always() && steps.migration-detect.outputs.changed == 'true'
        run: |
          python3 - "$RUNNER_TEMP/compat-report.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  report = json.load(fh)
          except OSError:
              print("## Migration compat check\n\nNo report was written; the check failed before it started.")
              sys.exit(0)
          print("## Migration compat check")
          print()
          print(f"- forward_ok: `{str(report['forward_ok']).lower()}`")
          print(f"- classification: `{report['classification']}`")
          print(f"- pending: {', '.join(report['pending']) or 'none'}")
          print(f"- runtime smoke (informational): `{report['runtime_smoke']['result']}`")
          print()
          print("| check | result | detail |")
          print("| --- | --- | --- |")
          for check in report["checks"]:
              print(f"| {check['name']} | {check['result']} | {check['detail']} |")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.migration-detect.outputs.changed == 'true'
        with:
          name: compat-report
          path: ${{ runner.temp }}/compat-report.json
          if-no-files-found: warn

  crawler:
    name: Crawler tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tests/conftest.py runs `dotnet tool restore`, `dotnet build` and `dotnet ef` to generate the schema for the
      # DB tests; without the SDK those tests would be skipped.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet tool restore

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: crawler/requirements*.txt

      - run: pip install -r requirements.txt
        working-directory: crawler

      # Browser tests launch real headless Chromium against local pages; without it they are skipped.
      - run: python -m playwright install --with-deps chromium
        working-directory: crawler

      - run: pytest --junitxml=test-results/junit.xml
        working-directory: crawler

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: crawler-test-results
          path: crawler/test-results
          if-no-files-found: warn
