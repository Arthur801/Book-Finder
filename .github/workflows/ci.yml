name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pushes to main are keyed per commit so every merge commit keeps its own run; PRs still cancel superseded runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore Book-Finder.slnx

      # Fails when whitespace or formatting in the .NET projects differs from dotnet format's default rules (the repo has no .editorconfig).
      - run: dotnet format Book-Finder.slnx --verify-no-changes --no-restore

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      # Dependabot bumps EF Core packages but not the dotnet-ef tool manifest; keep them in lockstep.
      - run: python .github/scripts/check_version_sync.py

      # The ruff version is pinned in crawler/requirements.txt, the single source of truth for this job.
      - run: |
          ruff_pin=$(grep -E '^ruff==' requirements.txt || true)
          test -n "$ruff_pin" || { echo "::error::ruff==<version> pin not found in crawler/requirements.txt"; exit 1; }
          pip install "$ruff_pin"
        working-directory: crawler

      - run: ruff check --output-format github .
        working-directory: crawler

      - run: ruff format --check .
        working-directory: crawler

  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # No packages.lock.json is checked in, so setup-dotnet's built-in cache cannot be keyed; cache the NuGet store directly.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore Book-Finder.slnx

      - run: dotnet build Book-Finder.slnx --no-restore -c Release

      # Integration projects start pgvector through Testcontainers; ubuntu-latest provides Docker.
      - run: dotnet test Book-Finder.slnx --no-build -c Release --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults
          if-no-files-found: warn

  crawler:
    name: Crawler tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tests/conftest.py runs `dotnet tool restore`, `dotnet build` and `dotnet ef` to generate the schema for the
      # DB tests; without the SDK those tests would be skipped.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet tool restore

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: crawler/requirements*.txt

      - run: pip install -r requirements.txt
        working-directory: crawler

      # Browser tests launch real headless Chromium against local pages; without it they are skipped.
      - run: python -m playwright install --with-deps chromium
        working-directory: crawler

      - run: pytest --junitxml=test-results/junit.xml
        working-directory: crawler

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: crawler-test-results
          path: crawler/test-results
          if-no-files-found: warn
