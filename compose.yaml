services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: book_finder
      POSTGRES_USER: book_finder_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定密碼}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U book_finder_dev -d book_finder
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

